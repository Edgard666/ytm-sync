services:
  joal-controller:
    build: .
    image: joal-smart-controller:local
    container_name: joal-smart-controller
    restart: unless-stopped
    env_file: .env
    environment:
      # Le port interne du serveur ne varie pas : seul le port hôte est personnalisable.
      PORT: "8788"
    # Réseau Docker existant (bridge, br0, réseau personnalisé, etc.).
    # Attention : mode host exclu, car incompatible avec le mappage de ports ci-dessous.
    network_mode: "${DOCKER_NETWORK:-bridge}"
    ports:
      - "${WEBUI_PORT:-8788}:8788"
    # Active le menu WebUI dans l'onglet Docker d'Unraid, même en Docker Compose.
    # Le bouton Edit nécessite en revanche un conteneur créé avec un template Unraid.
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8788]/"
      net.unraid.docker.shell: "/bin/sh"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Démarrage : attribution unique de /data à PUID:PGID, puis abandon des droits root.
    # Le contrôleur et JOAL tournent ensuite sans aucune capacité.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    init: true
    # Donne au controleur le temps de restaurer les torrents qBittorrent en cas d'arret propre.
    stop_grace_period: 120s
