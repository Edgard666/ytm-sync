# Banc d'essai local : tracker de test + contrôleur (+ qBittorrent en option).
# Aucun tracker réel n'est contacté. Voir testbed/README.md.
#   docker compose -f compose.test.yaml up -d --build
#   docker compose -f compose.test.yaml --profile qbit up -d --build   (avec qBittorrent)
services:
  tracker:
    image: python:3.12-alpine
    container_name: joal-testbed-tracker
    command: ["python", "-u", "/testbed/tracker.py"]
    volumes:
      - ./testbed:/testbed:ro
    environment:
      TRACKER_PORT: "6969"
      TRACKER_INTERVAL: "60"
      # Imite un tracker privé : seuls les clients qBittorrent sont acceptés.
      ALLOWED_CLIENTS: "-qB"
    ports:
      - "6969:6969"

  controller:
    build: .
    image: joal-smart-controller:local
    container_name: joal-testbed-controller
    depends_on: [tracker]
    environment:
      ADMIN_PASSWORD: "banc-essai-123456"
      # Le tracker de test est sur le réseau Docker (adresse privée) :
      # à n'activer QUE sur ce banc d'essai.
      ALLOW_PRIVATE_TRACKERS: "1"
      QBIT_URL: ""
      PUID: "99"
      PGID: "100"
    volumes:
      - ./testbed/controller-data:/data
    ports:
      - "8789:8788"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH, SETUID, SETGID]
    init: true
    stop_grace_period: 120s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: joal-testbed-qbittorrent
    profiles: ["qbit"]
    environment:
      PUID: "99"
      PGID: "100"
      WEBUI_PORT: "8080"
    volumes:
      - ./testbed/qbit-config:/config
      - ./testbed/generated/data:/downloads
    ports:
      - "8080:8080"
